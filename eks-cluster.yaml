
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: netflix-eks-cluster
  region: us-east-1
  version: "1.35"

vpc:
  id: vpc-0de31905cda887ac6
  subnets:
    public:
      us-east-1a:
        id: subnet-05ccdb6a5682e59e1
      us-east-1b:
        id: subnet-01c92946a8d4cfc79
    private:
      us-east-1a:
        id: subnet-09e73c175ac2046bf
      us-east-1b:
        id: subnet-053bdf154e30d2841

managedNodeGroups:
  - name: netflix-workers
    instanceType: t3.medium
    privateNetworking: true
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
    subnets:
      - subnet-09e73c175ac2046bf
      - subnet-053bdf154e30d2841
